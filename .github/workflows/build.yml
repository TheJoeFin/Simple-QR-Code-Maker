name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: x64
        - os: windows-latest
          platform: x64
        - os: windows-11-arm
          platform: ARM64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Run headless tests with coverage
      shell: pwsh
      run: .\scripts\Test.ps1 -Platform ${{ matrix.platform }} -Coverage
    - name: Upload results and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.platform }}
        path: TestResults
        if-no-files-found: warn

  build:
    name: Packaged app (x64)
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup .NET 10 runtime and SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    # Existing app sources use preview collection-expression arguments.
    - name: Setup preview compiler
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: preview
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: dotnet msbuild "Simple QR Code Maker.slnx" /restore /p:Configuration=Release /p:Platform=x64 /nologo